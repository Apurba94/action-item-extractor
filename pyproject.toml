[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "action-item-extractor"
version = "0.1.0"
description = "Extract action items, owners and due dates from Markdown meeting notes."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
action-item-extractor = "action_item_extractor.cli:main"

[tool.setuptools]
packages = ["action_item_extractor"]
